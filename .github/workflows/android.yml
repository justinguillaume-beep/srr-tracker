name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-debug-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk srr-tracker-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: srr-tracker-debug
          path: srr-tracker-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ./srr-tracker-debug.apk \
            --target "${{ github.sha }}" \
            --title "SRR Tracker (debug APK)" \
            --notes "Debug build from ${{ github.sha }}. On the phone: allow install from unknown sources, download srr-tracker-debug.apk, and open it."
